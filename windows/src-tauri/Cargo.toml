[package]
name = "coucou"
description = "Coucou for Windows — Mochi lives at the top of your screen"
authors = ["Louis Raille"]
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "coucou_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
arboard = { version = "3", default-features = false }
# Same versions tauri/wry use: drops arrive through WebView2's web messages.
webview2-com = "0.39"
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native"] }
# Local files for Ollama: PDF text layer, Word/ODT text, image re-encoding.
pdf-extract = "0.9"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Data_Pdf",
  "Storage",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_WinRT",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_DataExchange",
  "Win32_System_Ole",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_System_Com",
  "Win32_System_Variant",
] }
